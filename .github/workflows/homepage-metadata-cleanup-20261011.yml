name: Verify live homepage metadata and official icon
on:
  push:
    branches: [fix/homepage-metadata-icons-20261011]
    paths: [.github/workflows/homepage-metadata-cleanup-20261011.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public homepage, Apple icon, favicon and unchanged social image
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct, time, urllib.request
          from html.parser import HTMLParser
          root = 'https://www.thescanapp.com/'
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'ScanAppDeploymentVerification/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  assert response.status == 200
                  return response.read(), response.headers.get('Content-Type', '')
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta = {}; self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'meta':
                      key = attrs.get('property', attrs.get('name'))
                      if key:
                          self.meta.setdefault(key, []).append(attrs.get('content'))
                  if tag == 'link': self.links.append(attrs)
          for attempt in range(8):
              try:
                  html_bytes, mime = get(root)
                  assert 'text/html' in mime
                  head = Head(); head.feed(html_bytes.decode('utf-8'))
                  assert head.meta.get('og:site_name') == ['ScanApp']
                  assert head.meta.get('og:locale') == ['en_CA']
                  assert head.meta.get('theme-color') == ['#0b0b0b']
                  description = 'ScanApp connects DMS purchase orders, OEM shipments, physical receipts and invoices to help dealerships receive parts and reconcile exceptions.'
                  for key in ['description', 'og:description', 'twitter:description']:
                      assert head.meta.get(key) == [description], key
                  assert head.meta.get('og:image') == [root + 'graphics/scanapp-social-share-official.jpg']
                  assert head.meta.get('twitter:image') == [root + 'graphics/scanapp-social-share-official.jpg']
                  canonical = [a for a in head.links if a.get('rel') == 'canonical']
                  assert len(canonical) == 1 and canonical[0].get('href') == root
                  apple = [a for a in head.links if a.get('rel') == 'apple-touch-icon']
                  assert len(apple) == 1 and apple[0].get('href') == '/apple-touch-icon.png' and apple[0].get('sizes') == '180x180'
                  icon, icon_mime = get(root + 'apple-touch-icon.png')
                  assert 'image/png' in icon_mime
                  assert struct.unpack('>II', icon[16:24]) == (180,180)
                  assert hashlib.sha256(icon).hexdigest() == 'aca841ff903a98573b135dea9018dd205575f561663d93d97120915c85bc5d5f'
                  social, social_mime = get(root + 'graphics/scanapp-social-share-official.jpg')
                  assert 'image/jpeg' in social_mime
                  assert hashlib.sha256(social).hexdigest() == 'a80590f38b439169494e3fdff52a11c6e77d9988ee92e977e7f0fecc7a73cd4a'
                  fav, fav_mime = get(root + 'favicon.ico')
                  assert fav[:4] == b'\x00\x00\x01\x00'
                  sizes = []
                  for n in range(struct.unpack('<H', fav[4:6])[0]):
                      w,h = fav[6+16*n:8+16*n]
                      sizes.append((w or 256,h or 256))
                  assert (32,32) in sizes
                  report = {'result':'PASS','url':root,'site_name':'ScanApp','locale':'en_CA','description_characters':len(description),'apple_icon':'180x180; exact verified image','existing_favicon_sizes':sizes,'social_image':'unchanged; exact hash match','canonical':'unchanged'}
                  print(json.dumps(report, indent=2))
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                      out.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
                  break
              except Exception:
                  if attempt == 7: raise
                  time.sleep(10)
          PY
