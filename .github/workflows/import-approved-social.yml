name: Check published ScanApp social image
on:
  push:
    branches: [fix/social-preview-official-20261010]
    paths: [.github/workflows/import-approved-social.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public homepage and approved image
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          homepage = 'https://www.thescanapp.com/'
          image_url = homepage + 'graphics/scanapp-social-share-official.jpg'
          with urllib.request.urlopen(homepage, timeout=30) as response:
              page_status = response.status
              html = response.read().decode('utf-8')
          assert page_status == 200
          assert '<meta property="og:image" content="' + image_url + '">' in html
          assert '<meta name="twitter:image" content="' + image_url + '">' in html
          with urllib.request.urlopen(image_url, timeout=30) as response:
              image_status = response.status
              mime = response.headers.get('Content-Type', '')
              data = response.read()
          digest = hashlib.sha256(data).hexdigest()
          assert image_status == 200
          assert 'image/jpeg' in mime
          assert len(data) == 356526
          assert digest == 'a80590f38b439169494e3fdff52a11c6e77d9988ee92e977e7f0fecc7a73cd4a'
          print(json.dumps({'result': 'PASS', 'homepage': homepage, 'page_status': page_status, 'og_image': image_url, 'twitter_image': image_url, 'image_status': image_status, 'content_type': mime, 'bytes': len(data), 'sha256': digest}, indent=2))
          PY
