name: Demo form review
on:
  push:
    branches: [dev/request-demo]
  pull_request:
    paths: [request-demo.html, request-demo.css, request-demo.js, site.js, site.css, '*.html', .github/review/demo-review.cjs, .github/workflows/demo-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/demo-review" playwright
          "$RUNNER_TEMP/demo-review/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test form and responsive layouts
        env:
          NODE_PATH: ${{ runner.temp }}/demo-review/node_modules
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/demo-server.log 2>&1 &
          node .github/review/demo-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-review
          path: demo-review-results/
          retention-days: 7
